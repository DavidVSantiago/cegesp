<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEGESP - InfoDados</title>

    <script src="../../server_simulator.js" defer></script>
    <link rel="stylesheet" href="../../algol-light.css">
    <link rel="stylesheet" href="../../templates/header/header.css">
    <script src="../../min.js"></script>
    <script src="infodados.js" defer></script>

    <style>
        main {
            margin-top: 5vw;
        }

        .page-title {
            text-align: center;
            color: #2d6fff;
            font-weight: 900;
            font-size: 2.2vw;
        }

        .form-container {
            max-width: 48vw;
            width: 100%;
            margin: 0 auto;
            padding: 2.5vw;
        }

        .form-label {
            display: block;
            margin-top: 0vw;
            margin-bottom: 0.8vw;
            font-size: 1.2vw;
            font-weight: bold;
            color: #333;
            font-family: var(--font-roboto);
        }

        .form-label:first-child {
            margin-top: 0;
        }

        .politicas-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1vw;
            margin-bottom: 1vw;
        }

        .radio-btn {
            width: 100%;
        }

        .radio-btn label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.8vw 1.2vw;
            min-height: 3vw;
            border-radius: var(--border-radius-components);
            border: 0.1vw solid #ccc;
            background-color: white;
            color: #333;
            font-size: 0.9vw;
            cursor: pointer;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        /* Ícones de Políticas Públicas */
        .politicas-grid .radio-btn label {
            justify-content: flex-start;
            gap: 0.6vw;
            font-weight: 600;
            border-width: 0.15vw;
        }

        .politicas-grid .radio-btn label::before {
            content: "";
            display: inline-block;
            width: 1.1vw;
            height: 1.1vw;
            flex-shrink: 0;
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            transition: background-color 0.3s ease;
        }

        /* COR DO ÍCONE */
        #educacao+label::before {
            mask-image: url("../../imgs/icons/form-icons/educacao.svg");
            -webkit-mask-image: url("../../imgs/icons/form-icons/educacao.svg");
            background-color: #27ae60;
        }

        #saude+label::before {
            mask-image: url("../../imgs/icons/form-icons/saude.svg");
            -webkit-mask-image: url("../../imgs/icons/form-icons/saude.svg");
            background-color: #5dade2;
        }

        #esporte+label::before {
            mask-image: url("../../imgs/icons/form-icons/esporte.svg");
            -webkit-mask-image: url("../../imgs/icons/form-icons/esporte.svg");
            background-color: #e74c3c;
        }

        /* BORDAS E TEXTOS - BOTÕES*/
        #educacao+label {
            color: #27ae60;
            border-color: #27ae6066;
        }

        #saude+label {
            color: #5dade2;
            border-color: #5dade266;
        }

        #esporte+label {
            color: #e74c3c;
            border-color: #e74c3c66;
        }

        .radio-btn input[type="radio"] {
            display: none;
        }

        .radio-btn input[type="radio"]:checked+label {
            background-color: #2d6fff;
            border-color: #2d6fff;
            color: white;
        }


        #educacao:checked+label {
            background-color: #27ae60;
            border-color: #27ae60;
            color: white;
        }

        #educacao:checked+label::before {
            background-color: white;
        }

        #saude:checked+label {
            background-color: #5dade2;
            border-color: #5dade2;
            color: white;
        }

        #saude:checked+label::before {
            background-color: white;
        }

        #esporte:checked+label {
            background-color: #e74c3c;
            border-color: #e74c3c;
            color: white;
        }

        #esporte:checked+label::before {
            background-color: white;
        }

        .hidden {
            display: none;
        }

        /*------- RESULTADOS------*/
        .resultado-container {
            width: min(100%, 48vw);
            max-width: 100%;
            margin: 2vw auto;
            padding: 1.5vw;
            border-radius: var(--border-radius-components);
            background-color: #fff;
            box-shadow: 0 0.4vw 1vw rgba(0,0,0,0.08);
        }

        .infodados-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2vw;
            width: 100%;
        }

        .infodados-media {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 0.5vw;
            border: 0.1vw solid #e0e0e0;
        }

        .infodados-footer {
            width: 100%;
            text-align: center;
            padding-top: 1vw;
            border-top: 0.1vw solid #eee;
        }

        .doc-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5vw;
            color: #2d6fff;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.1vw;
        }

        .doc-link:hover {
            text-decoration: underline;
        }

        .doc-title-label {
            display: block;
            color: #333;
            margin-bottom: 0.6vw;
            font-size: 1.2vw;
            font-weight: 500;
            font-family: var(--font-roboto);
            line-height: 1.4;
        }

        .doc-links-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4vw;
        }

        .doc-sublink {
            color: #2d6fff;
            font-size: 1.2vw;
            font-family: var(--font-roboto);
            text-decoration: none;
            word-break: break-word;
            transition: color 0.2s ease;
            line-height: 1.4;
        }

        .doc-sublink:hover {
            text-decoration: underline;
            color: #1a4ebd;
        }

        @media (max-width: 600px) {
            main {
                margin-top: 30vw;
            }

            .page-title {
                font-size: 7vw;
                line-height: 1.2;
            }

            .form-container {
                max-width: 100%;
                padding: 6vw;
            }

            .form-label {
                font-size: 4.5vw;
                margin-top: 5vw;
                margin-bottom: 2vw;
            }

            .resultado-container {
                width: 100%;
                max-width: 100%;
                margin: 6vw auto;
                padding: 4vw;
            }

            .doc-title-label,
            .doc-sublink {
                font-size: 4.5vw;
            }

            .doc-title-label {
                margin-bottom: 2vw;
            }

            .doc-links-container {
                gap: 2vw;
            }

            .radio-btn label {
                font-size: 3.8vw;
                min-height: 10vw;
            }

            .politicas-grid .radio-btn label {
                gap: 2vw;
            }

            .politicas-grid .radio-btn label::before {
                width: 4.5vw;
                height: 4.5vw;
            }
        }
    </style>
</head>

<body>
    <header id="header">CARREGADO DINAMICAMENTE!</header>

    <main>
        <algol-grid-layout cols="1fr" padding="0 5" paddingbreak="0 2">
            <algol-grid-item posh="center">

                <h2 class="page-title">ACESSO AOS REGISTROS PROCESSADOS</h2>
                <algol-spacer value="3" valuebreak="2"></algol-spacer>

                <div class="form-container algol-bubble-01">
                    <form id="infodadosForm">
                        <!--POLÍTICAS PÚBLICAS------------>
                        <p class="form-label">Políticas Públicas:</p>
                        <div class="politicas-grid">
                            <div class="radio-btn">
                                <input type="radio" name="politicas" id="educacao" value="educacao" required>
                                <label for="educacao">Educação</label>
                            </div>
                            <div class="radio-btn">
                                <input type="radio" name="politicas" id="saude" value="saude">
                                <label for="saude">Saúde</label>
                            </div>
                            <div class="radio-btn">
                                <input type="radio" name="politicas" id="esporte" value="esporte">
                                <label for="esporte">Esporte</label>
                            </div>
                            <!--
                            <div class="radio-btn">
                                <input type="radio" name="politicas" id="lazer" value="lazer">
                                <label for="lazer">Lazer</label>
                            </div>
                            <div class="radio-btn">
                                <input type="radio" name="politicas" id="seguranca" value="seguranca">
                                <label for="seguranca">Segurança Pública</label>
                            </div>
                            -->
                        </div>
                        <!-- ESFERA------------>
                        <p class="form-label">Esfera:</p>
                        <algol-select name="esfera" id="esfera" required>
                            <option value="" disabled selected>Selecione a esfera</option>
                            <option value="f">Federal</option>
                            <option value="e">Estadual</option>
                            <option value="m">Municipal</option>
                        </algol-select>

                        <div id="dynamic-fields">
                            <div id="ufGroup" class="hidden">
                                <p class="form-label">UF:</p>
                                <algol-select name="uf" id="uf"></algol-select>
                            </div>
                            <!--AGRUPAMENTO ------------>
                            <div id="agrupamentoGroup" class="hidden">
                                <p class="form-label">Agrupamento:</p>

                                <algol-grid-layout cols="1fr 1fr" gap="1" gapbreak="0.5">
                                    <algol-switch-radio name="agrupamento" value="municipio"
                                        label="Por município"></algol-switch-radio>
                                    <algol-switch-radio name="agrupamento" value="territorio"
                                        label="Por território"></algol-switch-radio>
                                </algol-grid-layout>

                                <div id="municipioGroup" class="hidden">
                                    <p class="form-label">Município:</p>
                                    <algol-select name="municipio" id="municipio"></algol-select>
                                </div>

                                <div id="territorioGroup" class="hidden">
                                    <p class="form-label">Território:</p>
                                    <algol-select name="territorio" id="territorio"></algol-select>
                                </div>

                                <algol-spacer value="1.5"></algol-spacer>
                            </div>
                        </div>
                        <!--PODERES ------------>
                        <p class="form-label">Poderes</p>
                        <algol-grid-layout id="agendaGrid" cols="repeat(3, 1fr)" colsbreak="1fr" gap="3" posh="stretch">
                            <div class="radio-btn">
                                <input type="radio" name="poder" id="executivo" value="executivo" required>
                                <label for="executivo">Executivo</label>
                            </div>
                            <div class="radio-btn">
                                <input type="radio" name="poder" id="legislativo" value="legislativo">
                                <label for="legislativo">Legislativo</label>
                            </div>
                            <div class="radio-btn" id="judiciarioContainer">
                                <input type="radio" name="poder" id="judiciario" value="judiciario">
                                <label for="judiciario">Judiciário</label>
                            </div>
                        </algol-grid-layout>

                        <algol-spacer value="1"></algol-spacer>

                        <p class="form-label">Etapas da Políticas Públicas</p>
                        <algol-select name="etapa" id="etapa" required>
                            <option value="" disabled selected>Selecione a etapa</option>
                            <option value="planejamento">Planejamento</option>
                            <option value="implementacao">Implementação</option>
                            <option value="avaliacao">Avaliação</option>
                        </algol-select>

                        <algol-spacer value="1"></algol-spacer>

                        <p class="form-label">Tema</p>
                        <algol-select name="theme" id="theme" required>
                        </algol-select>

                        <algol-spacer value="1"></algol-spacer>
                        <!--TIPO DE DOCUMENTO 
                       
                        <p class="form-label">Tipo de documento:</p>
                        <algol-select name="indicador" id="indicador">
                            <option value="loa">LOA</option>
                        </algol-select>
                    PERIODO 
                        <p class="form-label">Período</p>
                        <algol-grid-layout cols="1fr 1fr" colsbreak="1fr" gap="2" gapbreak="1" posh="stretch">
                            <algol-input-number name="start-year" placeholder="Ano de Início: Ex 2000"></algol-input-number>
                            <algol-input-number name="end-year" placeholder="Ano Final: Ex 2025"></algol-input-number>
                        </algol-grid-layout>
                        -->

                        <algol-spacer value="3"></algol-spacer>

                        <algol-button type="submit" color="#2d6fff" textcolor="white" size="big">Buscar</algol-button>
                    </form>
                </div>

                <algol-grid-layout cols="1fr" padding="0" posh="stretch">
                    <algol-grid-item posh="stretch">
                        <div id="resultadoInfodados" class="resultado-container algol-bubble-01"></div>
                    </algol-grid-item>
                </algol-grid-layout>
            </algol-grid-item>
        </algol-grid-layout>
    </main>

    <footer id="footer">CARREGADO DINAMICAMENTE!</footer>
</body>

</html>
